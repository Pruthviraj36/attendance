{% for student in students %}
<div class="bg-gray-800 border border-gray-600 rounded-lg p-4 flex flex-col items-center justify-center cursor-pointer transition transform hover:scale-105"
    :class="students['{{ student.enrollment_no }}'] === 'A' ? 'bg-red-900 border-red-500' : 'bg-gray-800'"
    @click="toggleAttendance('{{ student.enrollment_no }}')" x-init="initStudent('{{ student.enrollment_no }}')">

    <div class="text-[120px] font-black text-white mb-2 tracking-tighter leading-none">{{ student.enrollment_no[-3:] }}
    </div>
    <div class="text-xl text-gray-400 mb-1">{{ student.roll_no }}</div>
    <div class="text-lg font-bold text-blue-300 truncate w-full text-center">{{ student.name }}</div>

    <div class="mt-2 font-bold"
        :class="students['{{ student.enrollment_no }}'] === 'A' ? 'text-red-500' : 'text-green-500'"
        x-text="students['{{ student.enrollment_no }}'] === 'A' ? 'ABSENT' : 'PRESENT'">
    </div>
</div>
{% endfor %}
