{% if students %}
<div class="w-full h-full flex items-center justify-center relative perspective-1000"
    x-init="$nextTick(() => { $dispatch('students-loaded', [{% for s in students %}'{{ s.enrollment_no }}'{% if not loop.last %},{% endif %}{% endfor %}]); })">

    {% for student in students %}
    <!-- Slide Card -->
    <div x-show="currentIndex === {{ loop.index0 }}"
        x-transition:enter="transition ease-out duration-300 cubic-bezier(0.2, 0.8, 0.2, 1)"
        x-transition:enter-start="opacity-0 translate-x-12 scale-95"
        x-transition:enter-end="opacity-100 translate-x-0 scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-x-0 scale-100"
        x-transition:leave-end="opacity-0 -translate-x-12 scale-95"
        class="absolute inset-0 m-auto w-full max-w-lg h-fit glass-card p-0 flex flex-col items-center text-center shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/20 overflow-hidden bg-dark-main/40 backdrop-blur-xl">

        <!-- Decoration Header -->
        <div class="w-full h-1 bg-gradient-to-r from-primary-400 via-purple-500 to-pink-500"></div>

        <div class="p-10 w-full flex flex-col items-center relative">
            <!-- Status Stamp (Fixed Position) -->
            <div class="absolute top-4 right-4 z-20 pointer-events-none transform transition-all duration-300"
                x-show="students['{{ student.enrollment_no }}'] !== null"
                x-transition:enter="scale-0 rotate-45 opacity-0"
                x-transition:enter-end="scale-100 rotate-[-10deg] opacity-100">

                <template x-if="students['{{ student.enrollment_no }}'] === 'P'">
                    <div
                        class="border-4 border-green-500 text-green-500 font-black px-3 py-1 text-sm rounded-lg shadow-xl bg-black/50 backdrop-blur-md uppercase tracking-wider">
                        PRESENT
                    </div>
                </template>
                <template x-if="students['{{ student.enrollment_no }}'] === 'A'">
                    <div
                        class="border-4 border-red-500 text-red-500 font-black px-3 py-1 text-sm rounded-lg shadow-xl bg-black/50 backdrop-blur-md uppercase tracking-wider">
                        ABSENT
                    </div>
                </template>
            </div>

            <!-- Counter Badge -->
            <div
                class="text-[10px] font-bold text-white/40 bg-white/5 border border-white/5 px-3 py-1 rounded-full mb-8 tracking-widest">
                {{ loop.index }} / {{ students|length }}
            </div>

            <!-- Main Data -->
            <div class="group relative mb-6">
                <div class="text-[10px] font-bold text-primary-400 uppercase tracking-[0.3em] mb-2 opacity-80">Roll
                    Number</div>
                <h2
                    class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-white/50 font-mono tracking-tighter relative drop-shadow-2xl transition-transform duration-300 group-hover:scale-110">
                    {{
                    student.roll_no }}</h2>
            </div>

            <div class="flex flex-col items-center mb-8 w-full px-8">
                <div class="w-full h-px bg-gradient-to-r from-transparent via-white/10 to-transparent mb-6"></div>

                <div class="text-white/40 text-[10px] font-mono tracking-[0.2em] mb-2 uppercase">Enrollment No</div>
                <div
                    class="text-white/80 font-mono tracking-wider mb-6 bg-white/5 px-4 py-1 rounded-full text-sm border border-white/5">
                    {{ student.enrollment_no }}</div>

                <div class="w-full">
                    <div class="text-[10px] font-bold text-primary-300 uppercase mb-2 tracking-widest">Student Name
                    </div>
                    <div class="text-3xl font-bold text-white leading-tight drop-shadow-lg" title="{{ student.name }}">
                        {{
                        student.name }}</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4 w-full relative z-10">
                <button @click="markCurrent('P')"
                    x-bind:class="students['{{ student.enrollment_no }}'] === 'P' ? 'bg-green-500/30 border-green-500' : ''"
                    class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-green-500/20 bg-green-500/10 hover:bg-green-500/20 hover:border-green-500 hover:shadow-[0_0_20px_rgba(34,197,94,0.4)] transition-all duration-150 active:scale-95 group">
                    <span
                        class="text-3xl font-bold text-green-400 mb-1 group-hover:scale-110 transition-transform">✓</span>
                    <span class="text-[10px] font-bold text-green-200/70 uppercase tracking-widest">Present</span>
                </button>

                <button @click="markCurrent('A')"
                    x-bind:class="students['{{ student.enrollment_no }}'] === 'A' ? 'bg-red-500/30 border-red-500' : ''"
                    class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-red-500/20 bg-red-500/10 hover:bg-red-500/20 hover:border-red-500 hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] transition-all duration-150 active:scale-95 group">
                    <span
                        class="text-3xl font-bold text-red-400 mb-1 group-hover:scale-110 transition-transform">✕</span>
                    <span class="text-[10px] font-bold text-red-200/70 uppercase tracking-widest">Absent</span>
                </button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center text-white/40 p-8 animate-fade-in">
    <div class="bg-white/5 rounded-full p-8 mb-6 inline-block shadow-lg border border-white/5">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="opacity-30"
            viewBox="0 0 16 16">
            <path
                d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1h8zm-7.978-1A.261.261 0 0 1 7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002a.274.274 0 0 1-.014.002H7.022zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM6.936 9.28a5.88 5.88 0 0 0-1.23-.247A7.35 7.35 0 0 0 5 9c-4 0-5 3-5 4 0 .667.333 1 1 1h4.216A2.238 2.238 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816zM4.92 10A5.493 5.493 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275zM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0zm3 3a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" />
        </svg>
    </div>
    <h3 class="text-3xl font-bold mb-2 tracking-tight">No Students Found</h3>
    <p class="text-lg text-white/60">Try adjusting the session settings.</p>
</div>
{% endif %}
