<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body class="text-gray-900 h-screen overflow-hidden flex bg-gray-50" x-data="attendanceApp()">

    <!-- Header -->
    <div class="bg-white border border-gray-200 shadow-lg p-4 flex justify-between items-center z-10 relative">
        <h1 class="text-4xl font-black text-blue-600 tracking-tighter">ATTENDANCE</h1>

        <div class="flex items-center space-x-8">
            <div class="text-center">
                <div class="text-sm text-gray-600 uppercase tracking-widest">Present</div>
                <div class="text-4xl font-black text-green-400" x-text="presentCount" aria-live="polite">0</div>
            </div>
            <div class="text-center">
                <div class="text-sm text-gray-600 uppercase tracking-widest">Absent</div>
                <div class="text-4xl font-black text-red-400" x-text="absentCount" aria-live="polite">0</div>
            </div>

            <button id="save-attendance-btn" @click="saveAttendance" tabindex="0" aria-label="Save Attendance"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl text-xl transition transform hover:scale-105 shadow-lg shadow-blue-500/30 flex items-center"
                x-bind:disabled="isLoading">
                <span x-show="!isLoading && !hasError">SAVE ATTENDANCE</span>
                <span x-show="isLoading" class="flex items-center">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    SAVING...
                </span>
                <span x-show="!isLoading && hasError" @click="retrySave" class="cursor-pointer">RETRY SAVE</span>
            </button>

            <a href="{{ url_for('logout') }}" aria-label="Logout"
                class="text-gray-600 hover:text-gray-900 transition p-2 flex items-center space-x-2" title="Logout">
                <span class="text-lg font-bold">LOGOUT</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </a>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="w-80 bg-white border-r border-gray-200 p-6 overflow-y-auto flex-shrink-0">
        <h2 class="text-xl font-bold mb-6 text-gray-800">Filters & Controls</h2>

        <!-- Subject -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
            <select class="w-full border border-gray-300 rounded-md p-2 focus:border-blue-500 outline-none">
                <option value="{{ user.subject }}">{{ user.subject }}</option>
            </select>
        </div>

        <!-- Slot -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Slot</label>
            <select x-model="selectedSlot" class="w-full border border-gray-300 rounded-md p-2 focus:border-blue-500 outline-none">
                {% for slot in slots %}
                <option value="{{ slot.name }}">{{ slot.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Batch -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Batch</label>
            <select x-model="selectedBatch" name="batch" class="w-full border border-gray-300 rounded-md p-2 focus:border-blue-500 outline-none">
                <option value="">All</option>
                {% for batch in batches %}
                <option value="{{ batch }}">{{ batch }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Semester -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Semester</label>
            <select x-model="selectedSemester" name="semester" class="w-full border border-gray-300 rounded-md p-2 focus:border-blue-500 outline-none">
                <option value="">All</option>
                {% for semester in semesters %}
                <option value="{{ semester }}">{{ semester }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Roll Range -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Start Roll</label>
            <input type="number" name="start_roll" x-model="startRoll" class="w-full border border-gray-300 rounded-md p-2 focus:border-blue-500 outline-none" placeholder="101">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">End Roll</label>
            <input type="number" name="end_roll" x-model="endRoll" class="w-full border border-gray-300 rounded-md p-2 focus:border-blue-500 outline-none" placeholder="150">
        </div>

        <button id="load-students-btn" hx-get="/api/students" hx-target="#student-table" hx-include="[name='start_roll'], [name='end_roll'], [name='batch'], [name='semester'], [name='page']" hx-indicator="#loading-indicator" @htmx:after-request="focusFirstStudent" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition">
            Load Students
        </button>

        <!-- Pagination -->
        <div class="mt-6 flex justify-between items-center">
            <button @click="prevPage" x-bind:disabled="currentPage <= 1" class="bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded text-sm disabled:opacity-50">Prev</button>
            <span class="text-sm text-gray-600">Page {{ currentPage }}</span>
            <button @click="nextPage" class="bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded text-sm">Next</button>
        </div>
        <input type="hidden" name="page" x-model="currentPage">

        <div x-show="!isValidRollRange && (startRoll || endRoll)" class="text-red-600 text-sm mt-4" id="roll-error" role="alert">
            Please enter valid roll numbers (start must be less than end, both positive integers).
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Top Bar -->
        <div class="bg-white border-b border-gray-200 p-4 flex justify-between items-center shadow-sm">
            <div class="flex space-x-8">
                <div class="text-center">
                    <div class="text-sm text-gray-600 uppercase tracking-wider">Present</div>
                    <div class="text-3xl font-black text-green-600" x-text="presentCount" aria-live="polite">0</div>
                </div>
                <div class="text-center">
                    <div class="text-sm text-gray-600 uppercase tracking-wider">Absent</div>
                    <div class="text-3xl font-black text-red-600" x-text="absentCount" aria-live="polite">0</div>
                </div>
            </div>

            <div class="flex items-center space-x-6">
                <button id="save-attendance-btn" @click="saveAttendance" tabindex="0" aria-label="Save Attendance"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition transform hover:scale-105 shadow-lg"
                    x-bind:disabled="isLoading">
                    <span x-show="!isLoading && !hasError">SAVE ATTENDANCE</span>
                    <span x-show="isLoading" class="flex items-center">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        SAVING...
                    </span>
                    <span x-show="!isLoading && hasError" @click="retrySave" class="cursor-pointer">RETRY SAVE</span>
                </button>

                <a href="{{ url_for('logout') }}" aria-label="Logout" class="text-gray-600 hover:text-gray-900 transition flex items-center space-x-2" title="Logout">
                    <span class="text-lg font-bold">LOGOUT</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </a>
            </div>
        </div>

        <!-- Table Area -->
        <div class="flex-1 overflow-y-auto p-6 relative">
            <!-- Loading Indicator -->
            <div id="loading-indicator" class="htmx-indicator absolute inset-0 flex justify-center items-center bg-white/50 z-20">
                <div class="text-2xl text-blue-600 font-bold animate-pulse">Loading Students...</div>
            </div>

            <div id="student-table" class="bg-white rounded-lg shadow-sm border border-gray-200">
                <div class="p-8 text-center text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <p class="text-xl">Enter Roll Range to Load Students</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Notification -->
    <div id="custom-notification" class="fixed top-4 right-4 z-50 hidden bg-green-500 text-white p-4 rounded-lg shadow-lg max-w-sm transition-all duration-300">
        <div class="flex justify-between items-center">
            <strong id="notif-title"></strong>
            <button onclick="hideNotification()" class="ml-4 text-xl">&times;</button>
        </div>
        <p id="notif-message"></p>
    </div>

    <script src="{{ url_for('static', filename='js/attendance.js') }}"></script>
</body>

</html>
