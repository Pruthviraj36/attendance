{% extends "base.html" %}

{% block content %}
<div class="text-center mt-5">
    <h1 class="display-1">404</h1>
    <p class="lead">Page Not Found</p>
    <p>The page you are looking for does not exist.</p>
    <div class="mt-4">
        <a href="{{ url_for('login') }}" class="btn btn-primary me-2">Go to Login</a>
        {% if current_user.is_authenticated %}
            {% if current_user.email == 'admin@univ.edu' %}
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary me-2">Admin Dashboard</a>
            {% else %}
                <a href="{{ url_for('faculty_dashboard') }}" class="btn btn-secondary">Faculty Dashboard</a>
            {% endif %}
        {% endif %}
    </div>
</div>
{% endblock %}
